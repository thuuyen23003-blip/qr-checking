<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hệ thống quản lý chấm công nhân viên bằng mã QR</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#fff6ee;--bgo:#f3e2d0;--ink:#2a1608;--mute:#7a6a5d;--line:#efdfce;--brand:#ff7a1a;--bd:#d9480f;--ok:#0b8a63;--okbg:#e3f8f1;--warn:#a16207;--warnbg:#fef3c7;--bad:#c92a2a;--sh:0 1px 2px rgba(120,60,10,.06),0 10px 30px rgba(120,60,10,.08);--s1:#ff8a2a;--s2:#ff6a00;--st:#3d1d06;--sx:#1f0e03;--sm:rgba(255,255,255,.28);--t1:#fff8f2;--t2:#ffe9d6;--t3:#ffe3cc;--n1:#f7efe6;--n2:#f4e8dc;--l1:#ff9a3c;--l2:#ff6a00}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 'Be Vietnam Pro',system-ui,sans-serif;background:var(--bgo);color:var(--ink)}
body.im{background-size:cover;background-position:center;background-attachment:fixed}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
#app{min-height:100vh;transition:opacity .25s,transform .25s}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.rl{transform:rotate(90deg)}.ic.rr{transform:rotate(-90deg)}
.shell{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
.side{margin:14px 0 14px 14px;height:calc(100vh - 28px);position:sticky;top:14px;border-radius:26px;background:linear-gradient(180deg,var(--s1),var(--s2));color:var(--st);padding:20px 14px 14px;display:flex;flex-direction:column;overflow-y:auto;box-shadow:var(--sh)}
.logo{display:flex;align-items:center;gap:10px;color:var(--sx);font-weight:800;font-size:17px;line-height:1.2;padding:2px 8px 18px}
.logo i{width:36px;height:36px;border-radius:11px;background:#fff;display:grid;place-items:center;flex:none}
.logo i .ic{stroke:var(--bd)}
.lg2{width:36px;height:36px;border-radius:11px;object-fit:cover;flex:none}
.logo small{display:block;font-size:12px;font-weight:500;opacity:.8}
.nav{position:relative;display:flex;flex-direction:column;gap:4px;flex:none}
.pill{position:absolute;left:0;right:0;height:46px;border-radius:12px;background:#fff;box-shadow:0 8px 18px rgba(0,0,0,.14);transition:transform .38s cubic-bezier(.4,0,.2,1)}
.nav a{position:relative;height:46px;display:flex;align-items:center;gap:12px;padding:0 14px;border-radius:12px;color:inherit;text-decoration:none;font-weight:500;transition:color .2s}
.nav a:hover{color:var(--sx)}.nav a.on{color:var(--bd)}
.bdg{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;min-width:20px;height:20px;padding:0 6px;font-size:12px;display:grid;place-items:center}
.pres{margin-top:14px;padding-top:10px;border-top:1px solid rgba(255,255,255,.22);flex:none}
.phd{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;color:var(--sx);font-weight:600;padding:6px 8px;border-radius:10px;cursor:pointer}
.phd:hover{background:var(--sm)}
.phd b{background:var(--sm);border-radius:99px;padding:0 8px;font-size:12px}
.phd .ch{margin-left:auto;width:16px;height:16px;transition:transform .2s}.phd .ch.up{transform:rotate(180deg)}
.pl{max-height:190px;overflow-y:auto;padding:4px 0}
.pi{display:flex;align-items:center;gap:10px;padding:5px 8px}
.pi b{display:block;font-size:13px;color:var(--sx);line-height:1.2}.pi small{font-size:12px;opacity:.85}
.pav{position:relative;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--bd);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.pav i{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#22c55e;border:2px solid var(--s2)}
.pm{font-size:12px;padding:4px 8px;opacity:.85}
.me{margin-top:auto;display:flex;align-items:center;gap:6px;padding:10px;border-radius:16px;background:var(--sm);flex:none}
.side>.nav+.me,.side>.pres+.me{margin-top:auto}
.me>div{min-width:0;flex:1}
.av{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--bd);display:grid;place-items:center;font-weight:700;flex:none}
.me b{display:block;color:var(--sx);font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.me small{font-size:12px}
.me button{background:none;border:0;color:var(--st);cursor:pointer;padding:7px;border-radius:9px;transition:color .2s,background .2s;display:grid}
.me button:hover{color:var(--sx);background:rgba(255,255,255,.25)}
.main{margin:14px;border-radius:26px;background:var(--bg);padding:30px 34px 90px;min-height:calc(100vh - 28px);overflow:hidden}
body.im .main{background:var(--bg);background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.main .av{background:var(--t2)}
.mtop{display:none}
.scrim{display:none}
#page{max-width:1040px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
h2{font-size:17px;font-weight:700;margin-bottom:12px}
.sub{color:var(--mute);margin:4px 0 8px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.pa{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sec{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700;color:var(--mute);margin:26px 0 12px}.sec::after{content:'';flex:1;height:1px;background:var(--line)}
.ph+.sec{margin-top:14px}
.card{background:#fff;border-radius:18px;padding:22px;box-shadow:var(--sh);margin-bottom:18px;position:relative}
.ed{outline:2px dashed var(--brand);outline-offset:-2px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}.g2>.card{margin:0}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px;margin-bottom:18px}.g3>.card{margin:0}
.big{font-size:32px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.m{color:var(--mute);font-size:14px}
.sb{position:absolute;right:20px;top:20px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.sb.ok{background:var(--okbg);color:var(--ok)}.sb.clk{background:var(--n1);color:var(--mute)}.sb.wrn{background:var(--warnbg);color:var(--warn)}.sb.pay,.sb.shd{background:var(--t2);color:var(--bd)}
.bar{height:8px;background:var(--n2);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0}}
.chip{display:inline-block;border-radius:99px;padding:3px 11px;font-size:13px;font-weight:600;background:var(--n1);color:var(--mute);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.w{background:var(--warnbg);color:var(--warn)}
.btn{border:0;background:var(--bd);color:#fff;font-weight:600;padding:11px 20px;border-radius:12px;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s;display:inline-flex;align-items:center;justify-content:center}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px color-mix(in srgb,var(--brand) 40%,transparent)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.l{background:var(--t2);color:var(--bd)}.btn.l:hover{box-shadow:none;background:var(--t3)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn .ic{width:16px;height:16px;margin-right:6px}
.btn .ic.rl,.btn .ic.rr{margin:0}
label.btn{cursor:pointer}
select,input{padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:#fff}
.ti{width:100%;min-width:90px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff}.ti:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.sel{width:auto;min-width:0;padding:5px 8px;font-size:13px}
.un{display:flex;align-items:center;gap:8px}.un .ti{min-width:0}
input[type=checkbox]{padding:0;border:0;width:16px;height:16px;accent-color:var(--brand)}
.fl>.fr:last-child{border-bottom:0}
.fr{display:flex;gap:20px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.fk{flex:0 0 min(240px,38%);color:var(--mute);font-size:14px}
.hint{display:block;font-size:13px;opacity:.8}
.fv{flex:1;min-width:0;font-weight:600}
.brk{word-break:break-all;font-weight:500}
.rw2{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rw2:last-child{border-bottom:0}
.rg{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.who{display:flex;align-items:center;gap:10px;font-weight:600}
.ch{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.ch h2{margin:0}
.ma{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
.acc{border-bottom:1px solid var(--line)}.acc:last-child{border-bottom:0}
.as{display:flex;align-items:center;gap:12px;width:100%;padding:12px 6px;background:none;border:0;cursor:pointer;text-align:left;border-radius:12px;flex-wrap:wrap}
.as:hover{background:var(--t1)}
.as .ic.ch{margin-left:auto;transition:transform .2s;color:var(--mute)}
.acc.op>.as .ic.ch{transform:rotate(180deg)}
.nmv{display:flex;flex-direction:column;line-height:1.3;min-width:0;flex:1 1 160px}.nmv small{color:var(--mute);font-size:13px}
.amt{margin-left:auto;font-variant-numeric:tabular-nums}
.ab{display:none;padding:2px 10px 16px}
.acc.op>.ab{display:block}
.tbr{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.srch{position:relative;flex:1 1 240px}
.srch .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute);width:18px;height:18px}
.srch input{padding-left:38px}
.fc{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.fch{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-weight:600;font-size:13px;cursor:pointer;color:var(--mute);transition:background .15s}
.fch b{margin-left:6px;opacity:.75}
.fch.on{background:var(--bd);color:#fff;border-color:var(--bd)}
.dr{display:flex;gap:8px;align-items:center;margin-top:8px}.dr .ti{min-width:0}
.ph2{display:flex;align-items:center;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:4px}
.av.xl{width:60px;height:60px;font-size:24px}.nm2{font-size:20px;font-weight:800}
.wk{display:grid;gap:10px}
.wr{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:14px;background:var(--t1)}
.wd{width:40px;height:40px;border-radius:12px;background:var(--bd);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.ws{display:flex;gap:8px;flex-wrap:wrap}
.sh{background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-weight:600;font-size:14px}.sh small{color:var(--mute);font-weight:500;margin-left:8px;font-size:13px}
.tg{width:34px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--mute);font-weight:700;cursor:pointer;transition:transform .15s,background .2s,color .2s}
.tg.on{background:var(--bd);border-color:var(--bd);color:#fff}.tg:active{transform:scale(.88)}
.sr2{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.sr2>div{flex:1 1 220px}.sr2 .btn{margin-left:auto}
.sb2{width:44px;height:44px;border-radius:12px;background:var(--t2);color:var(--bd);display:grid;place-items:center;flex:none}
.note{display:flex;gap:12px;align-items:center;background:var(--warnbg)}
.cn,.mn{display:flex;align-items:center;gap:12px;font-weight:700}.cn{margin-bottom:14px}
.leg{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;margin-bottom:14px}.leg span{display:flex;align-items:center;gap:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal b{text-align:center;font-size:13px;font-weight:700;color:var(--bd);padding-bottom:4px}
.dy{font:inherit;color:inherit;text-align:left;cursor:pointer;min-height:68px;padding:8px;border:1px solid var(--line);border-radius:12px;background:#fff;transition:background .15s,border-color .15s}
.dy:hover:not(:disabled){background:var(--t1)}
.dy>span{font-weight:700;font-size:14px}
.dy>div{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.dy.td>span{color:var(--bd)}.dy.td{border-color:var(--brand)}
.dy.sl{background:var(--t2);border:2px solid var(--bd)}
.dy.fu{border-color:transparent;background:none;cursor:default}.dy.fu>span{color:#a39383;font-weight:500}
.dy u,.leg u{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 5px;border-radius:7px;background:var(--n2);color:var(--mute);font-size:11px;font-weight:700;text-decoration:none}
.dy u.g,.leg u.g{background:var(--bd);color:#fff}.dy u.x,.leg u.x{background:#f59f00;color:#2a1608}
.leg u{min-width:14px;height:14px;padding:0}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}.days>.card{margin:0}
.sr{display:grid;grid-template-columns:64px 1fr 1fr auto;gap:6px;margin-bottom:8px}.sr .n{min-width:0}
.sl{margin-bottom:8px}
.stp{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.stp:last-child{border:0}.stp>span:nth-child(2){flex:1;font-weight:600}
.sn{width:30px;height:30px;border-radius:50%;background:var(--n1);display:grid;place-items:center;font-weight:700;flex:none}.sn.d{background:var(--okbg);color:var(--ok)}.sn .ic{width:18px;height:18px}
.qrw{position:relative;overflow:hidden;width:220px;margin:0 auto 16px;border-radius:14px}
.qrw svg{display:block;width:220px;height:220px;padding:12px;background:#fff;border:2px solid var(--ink);border-radius:14px;fill:var(--ink)}
.qrw.scan::after{content:'';position:absolute;left:0;right:0;height:4px;background:var(--brand);box-shadow:0 0 20px 6px color-mix(in srgb,var(--brand) 55%,transparent);animation:sw .9s ease-in-out}
@keyframes sw{0%,100%{top:0}50%{top:calc(100% - 4px)}}
.res{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.res.ok{background:var(--okbg)}.res.w{background:var(--warnbg)}
.stamp{width:112px;height:112px;border:4px solid var(--ok);border-radius:50%;color:var(--ok);display:grid;place-items:center;text-align:center;font-weight:800;font-size:16px;line-height:1.2;transform:rotate(-9deg);animation:st .45s cubic-bezier(.2,1.4,.5,1) both}
@keyframes st{from{transform:rotate(-9deg) scale(1.8);opacity:0}}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px}dt{color:var(--mute)}dd{font-weight:600}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.oF{animation:oF .18s ease-in both}.iF{animation:iF .36s cubic-bezier(.2,.8,.2,1) both}
.oB{animation:oB .18s ease-in both}.iB{animation:iB .36s cubic-bezier(.2,.8,.2,1) both}
@keyframes oF{to{opacity:0;transform:translateX(-36px)}}@keyframes iF{from{opacity:0;transform:translateX(48px)}}
@keyframes oB{to{opacity:0;transform:translateX(36px)}}@keyframes iB{from{opacity:0;transform:translateX(-48px)}}
.ov{position:fixed;inset:0;background:rgba(42,22,8,.45);display:grid;place-items:center;z-index:50;animation:fd .2s both}
.mb{background:#fff;border-radius:20px;padding:26px;width:min(460px,92vw);max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(42,22,8,.3);animation:pp .25s cubic-bezier(.2,.8,.2,1) both}
@keyframes fd{from{opacity:0}}@keyframes pp{from{opacity:0;transform:translateY(14px) scale(.97)}}
.ts{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#2a1608;color:#fff;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:92vw}.ts.on{opacity:1;transform:translate(-50%,0)}
.bgp{height:150px;border-radius:14px;background:linear-gradient(160deg,var(--l1),var(--l2))}
.swr{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.swb{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer;transition:transform .15s}.swb:hover{transform:scale(1.1)}.swb.on{box-shadow:0 0 0 3px var(--ink)}
.lgp{width:44px;height:44px;border-radius:12px;background:var(--t2);color:var(--bd);display:grid;place-items:center;overflow:hidden;flex:none}.lgp img{width:100%;height:100%;object-fit:cover}
.meter{height:6px;background:var(--n2);border-radius:99px;overflow:hidden;margin:-6px 0 6px}
.meter i{display:block;height:100%;width:0;border-radius:99px;transition:width .3s,background .3s}
.lbl2{display:block;font-size:13px;font-weight:600;margin-bottom:14px}
.sim{position:fixed;right:16px;bottom:16px;z-index:40;display:flex;gap:8px;align-items:center;background:#fff;box-shadow:var(--sh);border-radius:14px;padding:4px}
.sim button{border:0;background:none;font-weight:600;color:var(--mute);cursor:pointer;padding:6px 10px}
.sim>:not(:first-child){display:none}.sim.open>:not(:first-child){display:block}.sim input{padding:4px 8px}
.lgn{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bgo)}
.lc{width:min(1080px,100%);display:grid;grid-template-columns:1.05fr 1fr;background:#fff;border-radius:30px;padding:16px;box-shadow:0 30px 80px rgba(17,26,58,.12)}
.lp{background:linear-gradient(160deg,var(--l1),var(--l2));background-size:cover;background-position:center;position:relative;border-radius:22px;padding:44px;color:#fff;display:flex;flex-direction:column;min-height:560px;overflow:hidden}
.lp>.dc{position:absolute;inset:0;width:100%;height:100%;z-index:0}.lp>*:not(.dc){position:relative;z-index:1}
.lp h2{font-size:clamp(28px,3.6vw,42px);font-weight:800;letter-spacing:-.03em;line-height:1.2;margin:0 0 14px;max-width:420px}
.lp p{opacity:.9;max-width:360px}
.lp.hb h2,.lp.hb>p{text-shadow:0 2px 14px rgba(0,0,0,.55)}
.lp.hb .steps div{background:rgba(0,0,0,.4);backdrop-filter:blur(6px)}
.ul{position:relative;display:inline-block}
.ul svg{position:absolute;left:0;bottom:-8px;width:100%;height:10px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round}
@media(prefers-reduced-motion:no-preference){.ul svg{stroke-dasharray:220;stroke-dashoffset:220;animation:dr 1s .5s forwards}}
@keyframes dr{to{stroke-dashoffset:0}}
.steps{margin-top:auto;display:grid;gap:10px}.steps div{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.18);border-radius:14px;padding:12px 14px;font-weight:600}.steps b{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--bd);display:grid;place-items:center;font-size:14px;flex:none}
.lf{padding:34px 48px;display:flex;flex-direction:column;justify-content:center;max-width:460px;width:100%;margin:0 auto}
.lb{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:19px;margin-bottom:22px}
.lb i{width:36px;height:36px;border-radius:11px;background:var(--brand);display:grid;place-items:center}.lb .ic{stroke:#fff}
.lf h1{text-align:center;font-size:28px}.lf .sub{text-align:center;margin:6px 0 24px}
.lf label{display:block;font-size:13px;font-weight:600;margin-bottom:14px}
.in{width:100%;margin-top:6px;padding:13px 14px;border:1.5px solid transparent;background:var(--n1);border-radius:12px;transition:border-color .2s,background .2s}
.in:focus{outline:0;border-color:var(--brand);background:#fff}
.pw{position:relative}.pw button{position:absolute;right:6px;top:50%;margin-top:3px;transform:translateY(-50%);background:none;border:0;color:var(--mute);cursor:pointer;padding:8px}
.rw{display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:8px}.rw a{color:var(--bd);text-decoration:none;font-weight:600}
.lf .ck{display:flex;align-items:center;gap:8px;font-weight:500;margin:0}
.er{color:#d92d20;font-size:13px;min-height:20px;margin:8px 0}
.lgb{width:100%;padding:14px;font-size:16px}
.dv{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:13px;margin:22px 0 14px}.dv::before,.dv::after{content:'';flex:1;height:1px;background:var(--line)}
